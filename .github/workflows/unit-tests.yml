name: CI/CD for EC-CUBE
run-name: CI/CD for EC-CUBE

on:
  workflow_call:
    inputs:
      ref_name:
        required: false
        type: string
      base_ref:
        required: false
        type: string
      event_name:
        required: true
        type: string
      owner:
        required: true
        type: string
      use_prebuilt_image:
        # true の場合、イメージをビルドせず master で build & push 済みの
        # ghcr.io 公開イメージを利用する (refs #1438)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run-on-linux:
    name: Run on Linux
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ ubuntu-24.04 ]
        php: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && fromJSON('["8.4"]') || fromJSON('["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]') }}
        db: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && fromJSON('["mysql"]') || fromJSON('["mysql", "pgsql", "sqlite3"]') }}

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Build docker image
      if: ${{ !inputs.use_prebuilt_image }}
      uses: ./.github/actions/dockerbuild
      with:
        php-version: ${{ matrix.php }}

    - name: Create ADMIN_DIR
      run: |
        sudo apt install -y sharutils
        echo "ADMIN_DIR=$(head -c 10 < /dev/random | uuencode -m - | tail -n 2 |head -n 1 |  sed 's,[/+],_,g' | head -c10)/" >> $GITHUB_ENV

    - name: Setup environment
      env:
        REF_NAME: ${{ inputs.ref_name }}
        BASE_REF: ${{ inputs.base_ref }}
        EVENT_NAME: ${{ inputs.event_name }}
        OWNER: ${{ inputs.owner }}
        USE_PREBUILT_IMAGE: ${{ inputs.use_prebuilt_image }}
        DB: ${{ matrix.db }}
        PHP: ${{ matrix.php }}
      run: |
        echo "COMPOSE_FILE=docker-compose.yml:docker-compose.${DB}.yml:docker-compose.dev.yml" >> $GITHUB_ENV
        echo "IMAGE_NAME=${OWNER,,}/ec-cube2-php" >> $GITHUB_ENV
        if [ "$USE_PREBUILT_IMAGE" = "true" ]; then
          echo "TAG=${PHP}-apache" >> $GITHUB_ENV
        elif [ $EVENT_NAME = "pull_request" ]; then
          if [ -n $DOCKER_METADATA_OUTPUT_VERSION ]; then
            echo "TAG=${DOCKER_METADATA_OUTPUT_VERSION}" >> $GITHUB_ENV
          else
            echo "TAG=${PHP}-apache-${BASE_REF}" >> $GITHUB_ENV
          fi
        else
          echo "TAG=${PHP}-apache-${REF_NAME}" >> $GITHUB_ENV
        fi
    - run: |
        docker compose up -d --wait
        while [ ! -e "data/config/config.php" ]
        do
            printf "."
            sleep 1
        done
        cat data/config/config.php
        docker compose exec -T ec-cube composer dumpautoload
    - name: Run to PHPUnit
      run: docker compose exec -T ec-cube php data/vendor/bin/phpunit --exclude-group classloader,mysql_prepare,auth_type_plain
    - name: Run to PHPUnit classloader
      run: docker compose exec -T ec-cube php data/vendor/bin/phpunit --group classloader
    - name: Run to PHPUnit mysql_prepare
      # XXX 連続してテストを実行すると、何故か MySQL の prepare statement に失敗するため個別に実行する
      run: docker compose exec -T ec-cube php data/vendor/bin/phpunit --group mysql_prepare
    - name: Run to PHPUnit SessionFactory
      run: docker compose exec -T ec-cube php data/vendor/bin/phpunit tests/class/SC_SessionFactoryTest.php
    - name: Run to PHPUnit AUTH_TYPE=PLAIN
      # AUTH_TYPE は定数のためまとめて実行できない. PLAIN用のbootstrapで個別に実行する
      run: docker compose exec -T ec-cube php data/vendor/bin/phpunit --no-configuration --bootstrap tests/require_auth_type_plain.php --group auth_type_plain tests/class/util/SC_Utils/
    - name: Run to Email-template compatibility tests
      # 2.17.2-p2 のメールテンプレートで正常にテストが通るかチェックする
      run: |
        git fetch --tags -f
        git checkout eccube-2.17.2-p2 data/Smarty/templates/default/mail_templates
        docker compose exec -T ec-cube php data/vendor/bin/phpunit tests/class/helper/SC_Helper_Mail/

    - name: Print container logs on failure
      if: failure()
      continue-on-error: true
      run: docker compose logs ec-cube

    - name: Print error log
      if: always()
      continue-on-error: true
      run: docker compose exec ec-cube tail -n 100 data/logs/error.log

    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: linux-php${{ matrix.php }}-${{ matrix.db }}-logs
        path: data/logs

    - if: failure()
      run: docker compose logs -n 200
