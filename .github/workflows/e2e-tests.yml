name: E2E testing for EC-CUBE
run-name: E2E testing for EC-CUBE

on:
  workflow_call:
    inputs:
      ref_name:
        required: false
        type: string
      base_ref:
        required: false
        type: string
      event_name:
        required: true
        type: string
      owner:
        required: true
        type: string
      use_prebuilt_image:
        # true の場合、イメージをビルドせず master で build & push 済みの
        # ghcr.io 公開イメージを利用する (refs #1438)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run-on-linux:
    name: Run on Linux
    runs-on: ubuntu-24.04
    env:
      # E2E テストはすべて同一 IP からログイン試行を行うため、Playwright のリトライも
      # 含めると IP ベースのレート制限に達し、無関係なテストが偶発的に失敗する。
      # メールアドレスベースのしきい値（デフォルト 5 回）は変更しないため、
      # レート制限自体の E2E テストはメールアドレスベースで引き続き検証される。
      LOGIN_RATE_LIMIT_IP_THRESHOLD: 1000
    strategy:
      fail-fast: false
      matrix:
        # 3グループ (front_login/front_guest/admin) は1ジョブ内で順次実行する。
        # ジョブごとのセットアップ（イメージビルド・compose 起動・fixtures 生成・
        # npm/playwright 準備で約2分）を3回払うのをやめ、ジョブ数を 1/3 にする (refs #1438)
        pattern: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && fromJSON('["test:e2e"]') || fromJSON('["test:e2e", "test:e2e-extends"]') }}
        php: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && fromJSON('["8.4"]') || fromJSON('["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]') }}
        db: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && fromJSON('["mysql"]') || fromJSON('["mysql", "pgsql", "sqlite3"]') }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Build docker image
      if: ${{ !inputs.use_prebuilt_image }}
      uses: ./.github/actions/dockerbuild
      with:
        php-version: ${{ matrix.php }}

    - name: Cache npm dependencies
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: node_modules
        key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node_modules-

    - name: Cache Playwright browsers
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Setup environment
      env:
        REF_NAME: ${{ inputs.ref_name }}
        BASE_REF: ${{ inputs.base_ref }}
        EVENT_NAME: ${{ inputs.event_name }}
        OWNER: ${{ inputs.owner }}
        USE_PREBUILT_IMAGE: ${{ inputs.use_prebuilt_image }}
        DB: ${{ matrix.db }}
        PHP: ${{ matrix.php }}
        PATTERN: ${{ matrix.pattern }}
      run: |
        echo "COMPOSE_FILE=docker-compose.yml:docker-compose.${DB}.yml:docker-compose.dev.yml" >> $GITHUB_ENV
        echo "IMAGE_NAME=${OWNER,,}/ec-cube2-php" >> $GITHUB_ENV
        if [ "$USE_PREBUILT_IMAGE" = "true" ]; then
          echo "TAG=${PHP}-apache" >> $GITHUB_ENV
        elif [ $EVENT_NAME = "pull_request" ]; then
          if [ -n $DOCKER_METADATA_OUTPUT_VERSION ]; then
            echo "TAG=${DOCKER_METADATA_OUTPUT_VERSION}" >> $GITHUB_ENV
          else
            echo "TAG=${PHP}-apache-${BASE_REF}" >> $GITHUB_ENV
          fi
        else
          echo "TAG=${PHP}-apache-${REF_NAME}" >> $GITHUB_ENV
        fi
        echo "PATTERN=${PATTERN//:/-}" >> $GITHUB_ENV
    - if: matrix.pattern == 'test:e2e-extends'
      run: cp -rp tests/class/fixtures/page_extends/* data/class_extends/page_extends

    - name: Setup to EC-CUBE
      run: |
        docker compose up -d --wait
        while [ ! -e "data/config/config.php" ]
        do
            printf "."
            sleep 1
        done
        docker compose exec -T ec-cube composer dumpautoload
        # インストール完了直後は DB テーブル作成が終わっていない場合があるため
        # fixtures 生成は失敗時にリトライする (refs #1438)
        ok=0
        for i in 1 2 3; do
          if docker compose exec -T ec-cube php data/vendor/bin/eccube eccube:fixtures:generate --products=5 --customers=30 --orders=5; then
            ok=1
            break
          fi
          echo "fixtures:generate failed (attempt ${i}), retrying..."
          sleep 10
        done
        [ "$ok" = "1" ]

    - if: ${{ matrix.db == 'pgsql' }}
      run: |
        docker compose exec -T postgres psql --user=eccube_db_user eccube_db -c "UPDATE dtb_customer SET email = 'zap_user@example.com' WHERE customer_id = (SELECT MAX(customer_id) FROM dtb_customer WHERE status = 2 AND del_flg = 0);"

    - if: ${{ matrix.db == 'mysql' }}
      run: |
        docker compose exec mysql mysql --user=eccube_db_user --password=password eccube_db -e "UPDATE dtb_customer SET email = 'zap_user@example.com' WHERE customer_id = (SELECT customer_id FROM (SELECT MAX(customer_id) FROM dtb_customer WHERE status = 2 AND del_flg = 0) AS A);"

    - if: ${{ matrix.db == 'sqlite3' }}
      run: |
        docker compose exec -T ec-cube sqlite3 /var/www/app/data/eccube.db "UPDATE dtb_customer SET email = 'zap_user@example.com' WHERE customer_id = (SELECT MAX(customer_id) FROM dtb_customer WHERE status = 2 AND del_flg = 0);"

    - run: sleep 1
    - name: Install dependencies
      run: |
        npm ci
        npx playwright install chromium
    - name: Install Playwright system dependencies
      run: npx playwright install-deps chromium

    # fixtures 生成直後の DB 状態を保存し、グループ間で復元することで
    # 従来のグループ別ジョブと同じ初期状態を保証する
    - name: Create database snapshot
      id: snapshot
      run: |
        case "${{ matrix.db }}" in
          mysql)
            docker compose exec -T mysql sh -c 'mysqldump -uroot -ppassword eccube_db > /tmp/eccube_snapshot.sql'
            ;;
          pgsql)
            docker compose exec -T postgres pg_dump --user=eccube_db_user -Fc -f /tmp/eccube_snapshot.dump eccube_db
            ;;
          sqlite3)
            # WAL モードのため cp ではなく SQLite Backup API で一貫したスナップショットを取る。
            # リストアはコンテナ停止中にホスト側で行うため、マウントされた data/ 配下に置き、
            # リストア後も WAL モードになるようスナップショット側に設定しておく
            docker compose exec -T ec-cube sqlite3 /var/www/app/data/eccube.db ".backup /var/www/app/data/eccube_snapshot.db"
            docker compose exec -T ec-cube sqlite3 /var/www/app/data/eccube_snapshot.db "PRAGMA journal_mode=WAL;"
            ;;
        esac

    - name: Run to E2E testing (test/front_login)
      uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_on: error
        command: npm run ${{ matrix.pattern }} -- --output=test-results/front_login e2e-tests/test/front_login
      env:
        PATTERN: ${{ matrix.pattern }}
        CI: 1
        FORCE_COLOR: 1

    - name: Restore database snapshot (before test/front_guest)
      id: restore_front_guest
      if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
      run: |
        case "${{ matrix.db }}" in
          mysql)
            docker compose exec -T mysql sh -c 'mysql -uroot -ppassword eccube_db < /tmp/eccube_snapshot.sql'
            ;;
          pgsql)
            docker compose exec -T postgres pg_restore --user=eccube_db_user --clean --if-exists -d eccube_db /tmp/eccube_snapshot.dump
            ;;
          sqlite3)
            # 稼働中の Apache (mod_php) が SQLite への接続を保持したまま外部から
            # DB を書き換えると接続状態が壊れ、以降のシーケンス取得や INSERT が
            # MDB2 Error となる。healthcheck 等で再接続される余地を残さないよう、
            # コンテナを停止して全接続を閉じた状態でファイルを差し替えてから起動する
            docker compose stop -t 5 ec-cube
            sudo cp data/eccube_snapshot.db data/eccube.db
            sudo rm -f data/eccube.db-wal data/eccube.db-shm
            docker compose start ec-cube
            tries=0
            until curl -sf -k --connect-timeout 5 --max-time 10 https://localhost:4430/ -o /dev/null; do
              tries=$((tries+1))
              if [ "$tries" -ge 60 ]; then
                echo "ec-cube did not come back up" >&2
                exit 1
              fi
              sleep 1
            done
            ;;
        esac
        # mailcatcher もグループ開始時点の状態（空）に戻す
        curl --fail --silent --show-error -X DELETE http://localhost:1080/messages

    - name: Run to E2E testing (test/front_guest)
      if: ${{ !cancelled() && steps.restore_front_guest.outcome == 'success' }}
      uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_on: error
        command: npm run ${{ matrix.pattern }} -- --output=test-results/front_guest e2e-tests/test/front_guest
      env:
        PATTERN: ${{ matrix.pattern }}
        CI: 1
        FORCE_COLOR: 1

    - name: Restore database snapshot (before test/admin)
      id: restore_admin
      if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
      run: |
        case "${{ matrix.db }}" in
          mysql)
            docker compose exec -T mysql sh -c 'mysql -uroot -ppassword eccube_db < /tmp/eccube_snapshot.sql'
            ;;
          pgsql)
            docker compose exec -T postgres pg_restore --user=eccube_db_user --clean --if-exists -d eccube_db /tmp/eccube_snapshot.dump
            ;;
          sqlite3)
            # 稼働中の Apache (mod_php) が SQLite への接続を保持したまま外部から
            # DB を書き換えると接続状態が壊れ、以降のシーケンス取得や INSERT が
            # MDB2 Error となる。healthcheck 等で再接続される余地を残さないよう、
            # コンテナを停止して全接続を閉じた状態でファイルを差し替えてから起動する
            docker compose stop -t 5 ec-cube
            sudo cp data/eccube_snapshot.db data/eccube.db
            sudo rm -f data/eccube.db-wal data/eccube.db-shm
            docker compose start ec-cube
            tries=0
            until curl -sf -k --connect-timeout 5 --max-time 10 https://localhost:4430/ -o /dev/null; do
              tries=$((tries+1))
              if [ "$tries" -ge 60 ]; then
                echo "ec-cube did not come back up" >&2
                exit 1
              fi
              sleep 1
            done
            ;;
        esac
        # mailcatcher もグループ開始時点の状態（空）に戻す
        curl --fail --silent --show-error -X DELETE http://localhost:1080/messages

    - name: Run to E2E testing (test/admin)
      if: ${{ !cancelled() && steps.restore_admin.outcome == 'success' }}
      uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_on: error
        command: npm run ${{ matrix.pattern }} -- --output=test-results/admin e2e-tests/test/admin
      env:
        PATTERN: ${{ matrix.pattern }}
        CI: 1
        FORCE_COLOR: 1

    - name: Print error log
      if: always()
      continue-on-error: true
      run: docker compose exec ec-cube tail -n 100 data/logs/error.log

    - name: Upload evidence
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: linux-php${{ matrix.php }}-${{ matrix.db }}-${{ env.PATTERN }}-evidence
        path: 'test-results/'
    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: linux-php${{ matrix.php }}-${{ matrix.db }}-${{ env.PATTERN }}-logs
        path: data/logs
  installer:
    name: Installer test
    needs: [ run-on-linux ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: ['mysql', 'pgsql']
        php: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && fromJSON('["8.4"]') || fromJSON('["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]') }}
        include:
          - db: mysql
            dbport: '3306'
            dbuser: 'eccube_db_user'
            dbpass: 'password'
            dbname: 'eccube_db'
            dbhost: 'mysql'
          - db: pgsql
            dbport: '5432'
            dbuser: 'eccube_db_user'
            dbpass: 'password'
            dbname: 'eccube_db'
            dbhost: 'postgres'
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Build docker image
      if: ${{ !inputs.use_prebuilt_image }}
      uses: ./.github/actions/dockerbuild
      with:
        php-version: ${{ matrix.php }}

    - name: Cache npm dependencies
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: node_modules
        key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node_modules-

    - name: Cache Playwright browsers
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Setup environment
      env:
        REF_NAME: ${{ inputs.ref_name }}
        BASE_REF: ${{ inputs.base_ref }}
        EVENT_NAME: ${{ inputs.event_name }}
        OWNER: ${{ inputs.owner }}
        USE_PREBUILT_IMAGE: ${{ inputs.use_prebuilt_image }}
        DB: ${{ matrix.db }}
        PHP: ${{ matrix.php }}
      run: |
        echo "COMPOSE_FILE=docker-compose.yml:docker-compose.${DB}.yml:docker-compose.dev.yml" >> $GITHUB_ENV
        echo "IMAGE_NAME=${OWNER,,}/ec-cube2-php" >> $GITHUB_ENV
        if [ "$USE_PREBUILT_IMAGE" = "true" ]; then
          echo "TAG=${PHP}-apache" >> $GITHUB_ENV
        elif [ $EVENT_NAME = "pull_request" ]; then
          if [ -n $DOCKER_METADATA_OUTPUT_VERSION ]; then
            echo "TAG=${DOCKER_METADATA_OUTPUT_VERSION}" >> $GITHUB_ENV
          else
            echo "TAG=${PHP}-apache-${BASE_REF}" >> $GITHUB_ENV
          fi
        else
          echo "TAG=${PHP}-apache-${REF_NAME}" >> $GITHUB_ENV
        fi

    - name: Setup to EC-CUBE
      env:
        PHP_VERSION_TAG: ${{ matrix.php }}
      run: |
        sudo chown -R 1001:1000 zap
        sudo chmod -R g+w zap
        sh -c 'echo "<?php" >> data/config/config.php'
        docker compose up -d --wait

    - name: Wait for ec-cube to be ready
      run: |
        until curl -sf -k https://localhost:4430/ -o /dev/null 2>&1; do sleep 1; done
    - run: |
        rm data/config/config.php
        chmod -R o+w html
        chmod o+w data
        chmod -R o+w data/Smarty
        chmod -R o+w data/cache
        chmod -R o+w data/class
        chmod -R o+w data/class_extends
        chmod o+w data/config
        chmod -R o+w data/download
        chmod -R o+w data/downloads
        chmod o+w data/fonts
        chmod o+w data/include
        chmod o+w data/logs
        chmod -R o+w data/module
        chmod o+w data/smarty_extends
        chmod o+w data/upload
        chmod o+w data/upload/csv

    - name: Install Playwright system dependencies
      run: npx playwright install-deps chromium

    - name: Run to E2E testing
      uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_on: error
        command: npm run test:e2e -- e2e-tests/test/installer/installer.test.ts
      env:
        CI: 1
        FORCE_COLOR: 1
        DB_TYPE: ${{ matrix.db }}
        DB_USER: ${{ matrix.dbuser }}
        DB_PASSWORD: ${{ matrix.dbpass }}
        DB_NAME: ${{ matrix.dbname }}
        DB_PORT: ${{ matrix.dbport }}
        DB_SERVER: ${{ matrix.dbhost }}
    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: linux-php${{ matrix.php }}-${{ matrix.db }}-logs
        path: html/install/temp/install.log*
    - name: Upload evidence
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: linux-php${{ matrix.php }}-${{ matrix.db }}-evidence
        path: 'test-results/'
