name: Deploy EC-CUBE2
on:
  schedule:
    # 水曜日の 00:00 (JST) 頃に処理を実行する (UTC の火曜 15:xx は JST の水曜 0:xx)
    # 毎時 0 分は GitHub 側の混雑で数時間遅延しやすいため、分をずらしている
    - cron: '17 15 * * 2'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'リリースを作成せず、判定結果とリリース本文を Job Summary に出力する'
        type: boolean
        default: true
      force:
        description: '前回の Weekly build から変更が無くても作成する'
        type: boolean
        default: false
      tag-name:
        description: 'タグ名 (省略時は eccube2-weekly-<JST の日付>)'
        type: string
        required: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: deploy-${{ github.event_name == 'release' && github.event.release.tag_name || 'weekly' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    env:
      DRY_RUN: ${{ inputs.dry-run == true }}
    steps:
      # schedule はデフォルトブランチの HEAD、release はリリースのタグ、
      # workflow_dispatch は選択したブランチの HEAD (いずれも github.sha) を対象にする
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare weekly build
        id: prepare
        if: github.event_name != 'release'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_TAG_NAME: ${{ inputs.tag-name }}
          INPUT_FORCE: ${{ inputs.force == true }}
        with:
          script: |
            const fs = require('node:fs');
            const wb = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/weekly-build.js`);
            const prepared = await wb.prepareWeekly({
              github,
              context,
              inputs: {
                tagName: process.env.INPUT_TAG_NAME,
                force: process.env.INPUT_FORCE === 'true',
              },
            });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/prepared.json`, JSON.stringify(prepared));
            core.setOutput('deploy', String(prepared.deploy));
            core.setOutput('tag-name', prepared.tagName);
            if (!prepared.deploy) {
              core.notice(`Weekly build をスキップしました: ${prepared.reason}`);
              await wb.writeSummary(core, prepared);
            } else if (process.env.DRY_RUN === 'true') {
              await wb.writeSummary(core, prepared, { dryRun: true });
            }

      - name: Install to Composer
        if: github.event_name == 'release' || steps.prepare.outputs.deploy == 'true'
        run: composer install --no-scripts --no-dev --no-interaction --optimize-autoloader

      - name: Packaging
        if: github.event_name == 'release' || steps.prepare.outputs.deploy == 'true'
        env:
          TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || steps.prepare.outputs.tag-name }}
        run: |
          set -euo pipefail
          # タグ名は成果物のファイル名に使うため、パス区切り等を含むものは拒否する
          if [[ ! "${TAG_NAME}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::タグ名の形式が不正です (英数字と . _ - のみ使用できます): ${TAG_NAME}"
            exit 1
          fi
          # 作業ディレクトリは後続のステップで使うため、コピーしてから不要なファイルを削除する
          BUILD_DIR="${RUNNER_TEMP}/build"
          DIST_DIR="${RUNNER_TEMP}/dist"
          PKG="${BUILD_DIR}/ec-cube2"
          rm -rf "${BUILD_DIR}" "${DIST_DIR}"
          mkdir -p "${BUILD_DIR}" "${DIST_DIR}"
          cp -a "${GITHUB_WORKSPACE}" "${PKG}"

          echo "remove obsolete files..."
          excludes=(
            .git .gitignore .github .editorconfig .claude CLAUDE.md
            .php-cs-fixer.dist.php rector.php phpunit.xml.dist phpstan.neon.dist
            build.xml README.md playwright.config.ts e2e-tests tests templates docs
            html/test dockerbuild Dockerfile docker-compose*.yml zap
          )
          (cd "${PKG}" && rm -rf -- "${excludes[@]}")
          find "${PKG}" -name ".git*" -and ! -name ".gitkeep" -print0 | xargs -0 rm -rf

          echo "set permissions..."
          for d in html/install/temp html/user_data html/upload data/cache data/downloads \
                   data/Smarty data/class data/logs data/upload data/config; do
            chmod -R o+w "${PKG}/${d}"
          done
          chmod o+w "${PKG}/html"

          echo "compression files..."
          cd "${BUILD_DIR}"
          tar czfp "${DIST_DIR}/${TAG_NAME}.tar.gz" ec-cube2
          zip -ry "${DIST_DIR}/${TAG_NAME}.zip" ec-cube2 > /dev/null
          cd "${DIST_DIR}"
          for f in "${TAG_NAME}.tar.gz" "${TAG_NAME}.zip"; do
            # md5 / sha1 は歴史的経緯により残している
            md5sum "${f}" | awk '{ print $1 }' > "${f}.checksum.md5"
            sha1sum "${f}" | awk '{ print $1 }' > "${f}.checksum.sha1"
            sha256sum "${f}" | awk '{ print $1 }' > "${f}.checksum.sha256"
          done
          ls -al "${DIST_DIR}"

      - name: Publish weekly build
        if: github.event_name != 'release' && steps.prepare.outputs.deploy == 'true' && env.DRY_RUN != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const wb = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/weekly-build.js`);
            const prepared = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/prepared.json`, 'utf8'));
            const release = await wb.publishWeekly({ github, context, prepared, distDir: `${process.env.RUNNER_TEMP}/dist` });
            core.notice(`${prepared.tagName} を公開しました: ${release.html_url}`);
            await wb.writeSummary(core, prepared, { releaseUrl: release.html_url });

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const wb = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/weekly-build.js`);
            await wb.uploadAssets({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              releaseId: context.payload.release.id,
              distDir: `${process.env.RUNNER_TEMP}/dist`,
              tagName: context.payload.release.tag_name,
            });
